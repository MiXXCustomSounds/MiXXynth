name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache JUCE (FetchContent)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            juce-${{ runner.os }}-

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build DSP smoke test
        run: cmake --build build --config Release --target MiXXynthSmoke

      - name: Run DSP smoke test (TDD gate)
        run: ./build/Release/MiXXynthSmoke.exe

      - name: Build editor audit
        run: cmake --build build --config Release --target MiXXynthEditorAudit

      - name: Run editor audit (knob wiring + drag-drop)
        run: ./build/Release/MiXXynthEditorAudit.exe

      - name: Build VST3 and Standalone
        run: cmake --build build --config Release --target MiXXynth_VST3 MiXXynth_Standalone

      - name: Validate VST3 with pluginval
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval_Windows.zip
          Expand-Archive -Force pluginval_Windows.zip pluginval-ci
          ./pluginval-ci/pluginval.exe --strictness-level 5 --verbose "VST3/MiXXynth.vst3"

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiXXynth-VST3-Windows
          path: VST3/MiXXynth.vst3
          if-no-files-found: error
